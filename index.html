<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: wire-desk log. Sticky filter bar on top, then a day-by-day ledger with a date rail on the left and article entries on the right. */
:root{
  --bg:#ECEFF2; --surface:#FFFFFF; --ink:#13202B; --muted:#586674; --line:#D2D9DF;
  --accent:#0B5E73; --accent-ink:#FFFFFF; --mark:#FFE58A; --mark-ink:#3A2E00;
  --t-law:#2F4EA8; --t-hire:#0B7A5C; --t-pay:#A5541B; --t-ai:#7A3FA0; --t-ls:#B02A3A;
  --font-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E151B; --surface:#16202A; --ink:#E7EDF2; --muted:#92A1AE; --line:#263541;
  --accent:#5CC6D6; --accent-ink:#06222A; --mark:#4B3F10; --mark-ink:#FFE9A0;
  --t-law:#8FA9F2; --t-hire:#4FCBA3; --t-pay:#E5A06A; --t-ai:#C79BE6; --t-ls:#F08A97;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0E151B; --surface:#16202A; --ink:#E7EDF2; --muted:#92A1AE; --line:#263541;
  --accent:#5CC6D6; --accent-ink:#06222A; --mark:#4B3F10; --mark-ink:#FFE9A0;
  --t-law:#8FA9F2; --t-hire:#4FCBA3; --t-pay:#E5A06A; --t-ai:#C79BE6; --t-ls:#F08A97;
  color-scheme:dark;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--font-body);padding-inline:clamp(16px,4vw,40px)}
.wrap{max-width:1040px;margin:0 auto;padding-block:28px 64px}
a{color:inherit}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mast{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;padding-bottom:18px;border-bottom:2px solid var(--ink)}
.eyebrow{font:500 12px/1 var(--font-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
h1{margin:0;font-size:clamp(34px,6vw,56px);line-height:1.05;font-weight:700;letter-spacing:-.03em;text-wrap:balance}
.stamp{font:400 12px/1.6 var(--font-mono);color:var(--muted);text-align:right}
.stamp b{color:var(--ink);font-weight:500}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px;display:grid;gap:12px;border-bottom:1px solid var(--line)}
.row{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.search{flex:1 1 260px;display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);padding:0 12px;min-height:42px}
.search input{flex:1;border:0;background:transparent;outline:0;min-width:0;padding:8px 0}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);padding:6px 12px;cursor:pointer;font-weight:500;font-size:13.5px;display:inline-flex;gap:8px;align-items:baseline}
.chip i{font:400 11.5px var(--font-mono);font-style:normal;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[aria-pressed="true"] i{color:inherit;opacity:.7}
.chk{display:inline-flex;gap:8px;align-items:center;font-size:13.5px;cursor:pointer;user-select:none}
.chk input{width:16px;height:16px;accent-color:var(--accent);margin:0}
.note{font-size:12.5px;color:var(--muted);margin:14px 0 0;max-width:72ch}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:30px 0 4px}
h2{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em}
.count{font:400 12.5px var(--font-mono);color:var(--muted)}
.day{display:grid;grid-template-columns:132px 1fr;gap:0 24px;padding-top:22px}
.dayhead{position:sticky;top:calc(env(safe-area-inset-top,0px) + 132px);align-self:start;font:500 12.5px/1.4 var(--font-mono);color:var(--muted);letter-spacing:.04em}
.dayhead b{display:block;font:700 26px/1.1 var(--font-body);color:var(--ink);letter-spacing:-.02em;margin-bottom:4px}
.list{display:grid;gap:0;border-top:1px solid var(--ink)}
.art{background:var(--surface);padding:18px 20px;border-bottom:1px solid var(--line);display:grid;gap:10px}
.art.read .ttl{color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;font:400 12px var(--font-mono);color:var(--muted)}
.tag{font:600 12px var(--font-body);color:var(--tc);display:inline-flex;align-items:center;gap:6px}
.tag::before{content:"";width:8px;height:8px;background:var(--tc)}
.ttl{font-size:18px;line-height:1.4;font-weight:600;letter-spacing:-.01em;text-wrap:balance;margin:0}
.ttl a{text-decoration:none}
.ttl a:hover{text-decoration:underline;text-underline-offset:3px}
.sum{margin:0;max-width:66ch}
.cp{margin:0;max-width:66ch;display:flex;gap:10px;align-items:baseline;font-size:14px}
.cp span{flex:none;background:var(--mark);color:var(--mark-ink);font:600 12px var(--font-body);padding:1px 8px}
.cp p{margin:0}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:transparent;padding:4px 12px;font-size:13px;cursor:pointer}
.btn:hover{border-color:var(--ink)}
.btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.empty{padding:48px 0;color:var(--muted)}
.t-law{--tc:var(--t-law)}.t-hire{--tc:var(--t-hire)}.t-pay{--tc:var(--t-pay)}.t-ai{--tc:var(--t-ai)}.t-ls{--tc:var(--t-ls)}
.theme{border:1px solid var(--line);background:var(--surface);padding:6px 12px;cursor:pointer;font-size:13px;min-height:42px}
@media (max-width:700px){
  .day{grid-template-columns:1fr;gap:10px}
  .dayhead{position:static;display:flex;gap:10px;align-items:baseline}
  .dayhead b{font-size:22px;margin:0}
  .art{padding:16px}
  .stamp{text-align:left}
}
</style>

let saved=new Set(store.get("inveni.saved",[])),read=new Set(store.get("inveni.read",[]));
let topic="전체";
const fmt=(d,o)=>new Intl.DateTimeFormat("ko-KR",Object.assign({timeZone:"Asia/Seoul"},o)).format(d);
const key=d=>new Intl.DateTimeFormat("sv-SE",{timeZone:"Asia/Seoul"}).format(d);
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
$("stamp").textContent="기사 "+DATA.length+"건 · 2026.10.10 수집";
function chips(){
  const c=n=>n==="전체"?DATA.length:DATA.filter(a=>a.topic===n).length;
  $("chips").innerHTML=[["전체","전체"],...TOPICS].map(t=>`<button type="button" class="chip" data-t="${t[0]}" aria-pressed="${topic===t[0]}">${t[1]}<i>${c(t[0])}</i></button>`).join("");
}
function render(){
  const q=$("q").value.trim().toLowerCase(),os=$("onlySaved").checked,hr=$("hideRead").checked;
  const list=DATA.filter(a=>(topic==="전체"||a.topic===topic)&&(!os||saved.has(a.id))&&(!hr||!read.has(a.id))&&(!q||(a.title+a.sum+a.chk+a.src).toLowerCase().includes(q)));
  $("h2").textContent=topic==="전체"?"전체 기사":lab[topic];
  $("cnt").textContent=list.length+"건";
  if(!list.length){$("feed").innerHTML='<p class="empty">조건에 맞는 기사가 없습니다. 검색어나 필터를 바꿔 보세요.</p>';return}
  const g={};list.forEach(a=>(g[key(new Date(a.date))]??=[]).push(a));
  $("feed").innerHTML=Object.keys(g).sort().reverse().map(k=>{
    const d=new Date(g[k][0].date);
    return `<section class="day"><div class="dayhead"><b>${fmt(d,{month:"long",day:"numeric"})}</b><span>${fmt(d,{weekday:"long"})} · ${g[k].length}건</span></div><div class="list">`+
    g[k].map(a=>`<article class="art ${read.has(a.id)?"read":""}" data-id="${a.id}">
      <div class="meta"><span class="tag ${cls[a.topic]}">${lab[a.topic]}</span><span>${esc(a.src)}</span><span>${fmt(new Date(a.date),{hour:"2-digit",minute:"2-digit",hour12:false})}</span></div>
      <h3 class="ttl"><a href="${esc(a.link)}" target="_blank" rel="noopener noreferrer" data-open>${esc(a.title)}</a></h3>
      <p class="sum">${esc(a.sum)}</p>
      <div class="cp"><span>체크포인트</span><p>${esc(a.chk)}</p></div>

    </article>`).join("")+`</div></section>`}).join("");
}
$("chips").addEventListener("click",e=>{const b=e.target.closest("[data-t]");if(!b)return;topic=b.dataset.t;chips();render()});
$("feed").addEventListener("click",e=>{
  const art=e.target.closest(".art");if(!art)return;const id=art.dataset.id;
  if(e.target.closest("[data-save]")){saved.has(id)?saved.delete(id):saved.add(id);store.set("inveni.saved",[...saved]);render()}
  else if(e.target.closest("[data-read]")){read.has(id)?read.delete(id):read.add(id);store.set("inveni.read",[...read]);render()}
  else if(e.target.closest("[data-open]")){read.add(id);store.set("inveni.read",[...read]);art.classList.add("read")}
});
["q","onlySaved","hideRead"].forEach(id=>$(id).addEventListener("input",render));
$("theme").addEventListener("click",()=>{
  const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;
  r.dataset.theme=dark?"light":"dark"});
chips();render();
</script>
